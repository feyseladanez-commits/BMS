<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Building and Rental Registry</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
:root{--bg:#eef1f5;--card:#fff;--tx:#142033;--mu:#5a6a80;--ac:#0f6e46;--ac2:#12304f;--bd:#d5dce6;--er:#b3261e;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#0e1622;--card:#17212f;--tx:#e6ecf4;--mu:#93a3b8;--ac:#4cc58a;--ac2:#9cc4ee;--bd:#2a3a50;--er:#ff8f86}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 "Segoe UI",system-ui,"Noto Sans Ethiopic",sans-serif}
main{max-width:900px;margin:auto;padding:14px}h1{font-size:19px;margin:6px 0}
.card{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:12px;margin-bottom:10px}
input,select{width:100%;padding:9px;margin:4px 0;border:1px solid var(--bd);border-radius:6px;background:var(--card);color:var(--tx);font:inherit}
.btn{background:var(--ac);color:#fff;border:0;border-radius:6px;padding:9px 13px;margin:4px 4px 0 0;cursor:pointer;font:inherit}
.btn.g{background:none;color:var(--ac);border:1px solid var(--ac)}
input[type=checkbox]{width:auto;margin:3px 8px 0 0;padding:0}label.pw{display:flex;align-items:flex-start;margin:5px 0}details{margin:6px 0}summary{cursor:pointer;color:var(--ac);padding:4px 0}
.tabs{display:flex;gap:6px;margin-bottom:8px}.tabs button{flex:1}
.mu{color:var(--mu);font-size:13px}.st{border:1px solid var(--bd);border-radius:10px;padding:1px 8px;font-size:13px;font-weight:600}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0 8px}
#msg{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));padding:10px 14px;border-radius:8px;background:var(--ac2);color:var(--bg);display:none}
#letter{display:none;background:#fff;color:#111;border:2px solid #12304f;padding:26px;margin-top:10px}
#letter .qr{width:140px;height:140px;float:right}#letter .qr svg{width:100%;height:100%}
@media print{body>main>*:not(#letter){display:none!important}#letter{display:block!important}.btn{display:none}}
</style></head><body><main>
<h1>Building and Rental Registry <span lang="am">· የሕንፃና ኪራይ መዝገብ</span></h1>
<button class="btn g" onclick="lang=lang==='am'?'en':'am';localStorage.setItem('l',lang);render()">EN / አማ</button><div id="app"></div><div id="letter"></div></main><div id="msg" role="status"></div>
<script>
const $=s=>document.querySelector(s);const ask=m=>window.prompt(tx(m));let T=localStorage.getItem('t'),lang=localStorage.getItem('l')||'en',U=null,mode='in';
const ex=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),esc=s=>'<bdi class="u">'+ex(s)+'</bdi>';
function say(m){const e=$('#msg');e.textContent=tx(m);e.style.display='block';clearTimeout(say.h);say.h=setTimeout(()=>e.style.display='none',4000)}
async function api(p,o={}){const fd=o.body instanceof FormData,h=fd?{}:{'Content-Type':'application/json'};if(T)h.Authorization='Bearer '+T;
 const r=await fetch('/api/v1'+p,{method:o.method||(o.body?'POST':'GET'),headers:h,body:o.body&&!fd?JSON.stringify(o.body):o.body}),d=await r.json().catch(()=>({}));
 if(!r.ok){const x=d.detail;throw new Error(Array.isArray(x)?x.map(e=>(e.loc||[]).slice(-1)+': '+e.msg).join('; '):x||'Request failed')}return d}
const v=id=>$('#'+id).value.trim();
let META=null;const can=p=>((U&&U.powers)||[]).includes(p),meta=async()=>META=await api('/org-meta'),place=o=>o.woreda?o.woreda+(o.kebele?', '+o.kebele:''):'',VN={etrade:'eTrade',dars:'DARS',fayda:'Fayda'};
async function boot(){if(T){try{U=await api('/me')}catch(e){T=null;localStorage.removeItem('t')}}render()}
function authView(){return `<div class="card"><div class="tabs"><button class="btn ${mode==='up'?'':'g'}" onclick="mode='up';render()">Sign up</button><button class="btn ${mode==='in'?'':'g'}" onclick="mode='in';render()">Log in</button></div>
${mode==='up'?'<label>Full name<input id="an" autocomplete="name"></label>':''}
<label>Email<input id="ae" type="email" autocomplete="email"></label>
<label>Password${mode==='up'?' (8 characters or more)':''}<input id="ap" type="password" autocomplete="${mode==='up'?'new-password':'current-password'}"></label>
${mode==='in'?'<label>6-digit code (only if MFA is on)<input id="ac" inputmode="numeric" autocomplete="one-time-code"></label>':''}
<button class="btn" onclick="${mode==='up'?'signup()':'login()'}">${mode==='up'?'Create owner account':'Log in'}</button>
<p class="mu">${mode==='up'?'Sign up is for building owners. Offices and other organizations get accounts from an administrator.':'New building owner? Choose Sign up.'}</p></div>`}
async function signup(){try{if(!v('an'))return say('Enter your full name.');await api('/auth/register',{body:{name:v('an'),email:v('ae'),password:v('ap')}});await doLogin();say('Account created.')}catch(e){say(e.message)}}
async function login(){try{await doLogin()}catch(e){say(e.message)}}
async function doLogin(){const d=await api('/auth/login',{body:{email:v('ae'),password:v('ap'),code:($('#ac')||{value:''}).value.trim()||null}});T=d.token;localStorage.setItem('t',T);U=d.user;render()}
function logout(){T=null;U=null;localStorage.removeItem('t');render()}
async function render(){document.documentElement.lang=lang;document.title=tx('Building and Rental Registry');$('#letter').style.display='none';if(!U){$('#app').innerHTML=authView();tr($('#app'));return}
 const top=`<div class="card"><b>${esc(U.name)}</b> <span class="st">${U.org?esc(U.org.name):U.role}</span> <button class="btn g" style="float:right" onclick="logout()">Log out</button></div>`;
 $('#app').innerHTML=top+'<div id="body" class="mu">Loading…</div>';
 try{let h;try{h=await ({owner:ownerView,staff:staffView,admin:adminView})[U.role]()}catch(e){h=`<div class="card mu">${ex(tx(e.message))}</div>`}$('#body').outerHTML=h+await tools();tr($('#app'))}catch(e){say(e.message)}}
const bCard=(b,extra)=>`<div class="card"><b>${esc(b.name)}</b> <span class="st">${b.status.replace('_',' ')}</span><div class="mu">${esc(b.woreda)}, ${esc(b.kebele)} · ${b.lat}, ${b.lng} · ${b.floors} floors · ${Number(b.total_m2).toFixed(2)} m² · photos ${b.files.length}</div>${b.brn?`<div>BRN <b>${b.brn}</b></div>`:''}${b.issuer?`<div class="mu">Approved by ${esc(b.issuer)}</div>`:''}${b.reason?`<div class="mu">Officer note: ${esc(b.reason)}</div>`:''}${extra}${can('inspection.record')?`<button class="btn g" onclick="insp(${b.id})">Record inspection</button>`:''}</div>`;
async function ownerView(){const B=await api('/buildings'),C=await api('/contracts'),M=await meta();let h=`<div class="card"><b>Register a building</b><div class="row"><input id="bn" placeholder="Building name"><input id="bw" placeholder="Woreda" list="wl"><datalist id="wl">${M.woredas.map(w=>`<option value="${ex(w)}">`).join('')}</datalist><input id="bk" placeholder="Kebele"><input id="bf" type="number" min="1" placeholder="Floors"><input id="bla" placeholder="Latitude"><input id="blo" placeholder="Longitude"></div><button class="btn g" onclick="geo()">Use my location</button><button class="btn" onclick="addB()">Save draft</button></div>`;
 for(const b of B){let x='';
  if(['draft','correction_requested'].includes(b.status))x=`<input type="file" id="f${b.id}" accept=".jpg,.jpeg,.png,.pdf"><select id="c${b.id}"><option value="front">Front photo</option><option value="side">Side photo</option><option value="entrance">Entrance</option><option value="ownership">Ownership document</option></select><button class="btn g" onclick="up(${b.id})">Upload file</button><button class="btn" onclick="sub(${b.id})">Submit for approval</button>`;
  if(b.status==='approved'){const U2=await api(`/buildings/${b.id}/units`);x=`<button class="btn g" onclick='letter(${JSON.stringify({t:'Building Registration Letter',r:b.brn,k:b.tok,i:b.issuer,rows:[['BRN',b.brn],['Building',b.name],['Location',b.woreda+', '+b.kebele],['GPS',b.lat+', '+b.lng],['Registered area',Number(b.total_m2).toFixed(2)+' m²']]}).replace(/'/g,'&#39;')})'>Print registration letter</button>
   ${U2.map(u=>`<div class="mu">Unit ${esc(u.number)} · floor ${esc(u.floor)} · ${Number(u.m2).toFixed(2)} m² · ${esc(u.use)} <a href="#" onclick="area(${u.id});return false">change area</a></div>`).join('')}
   <div class="row"><input id="uf${b.id}" placeholder="Floor"><input id="un${b.id}" placeholder="Unit no."><input id="um${b.id}" type="number" step="0.01" placeholder="Area m²"><input id="uu${b.id}" placeholder="Use (shop, office)"></div><button class="btn g" onclick="addU(${b.id})">Add unit</button>
   ${U2.length?`<div class="row"><select id="cu${b.id}">${U2.map(u=>`<option value="${u.id}">${esc(u.number)} (${Number(u.m2).toFixed(2)} m²)</option>`).join('')}</select><input id="ct${b.id}" placeholder="Tenant name"><input id="cf${b.id}" placeholder="Fayda number (stored masked)"><input id="cr${b.id}" type="number" placeholder="Rent per month"><input id="cs${b.id}" type="date"><input id="ce${b.id}" type="date"></div><button class="btn" onclick="addC(${b.id})">Submit rental contract</button>`:''}`}
  h+=bCard(b,x)}
 h+='<h3>Rental contracts</h3>'+cList(C,false);return h}
const cList=(C,off)=>C.length?C.map(c=>`<div class="card"><b>${c.ref}</b> <span class="st">${c.status}</span><div>${esc(c.building)} · unit ${esc(c.unit)} · ${Number(c.m2).toFixed(2)} m²</div><div class="mu">${esc(c.tenant_name)} · ${c.start_date}${tx(' to ')}${c.end_date} · ${c.rent} ETB · Fayda ${c.fayda_last4?'••••'+c.fayda_last4:'none'} not verified</div>${c.issuer?`<div class="mu">Approved by ${esc(c.issuer)}</div>`:''}
${off&&c.status==='submitted'?`<button class="btn" onclick="ap(${c.id})">Approve</button>`:''}${c.status==='active'&&(U.role==='owner'||can('contract.terminate'))?`<button class="btn g" onclick="term(${c.id})">Terminate</button>`:''}${U.role==='owner'&&c.status==='active'?`<button class="btn g" onclick="decl(${c.id})">Declare income</button><button class="btn g" onclick="disp(${c.id})">Open dispute</button>`:''}${can('dispute.freeze')&&['active','submitted'].includes(c.status)?`<button class="btn g" onclick="disp(${c.id})">Freeze</button>`:''}
${['active','terminated'].includes(c.status)?`<button class="btn g" onclick='letter(${JSON.stringify({t:'Rental Contract Registration Letter',r:c.ref,k:c.tok,i:c.issuer,rows:[['Contract',c.ref],['Building',c.building+' ('+c.brn+')'],['Unit',c.unit+', '+Number(c.m2).toFixed(2)+' m²'],['Tenant',c.tenant_name],['Period',c.start_date+tx(' to ')+c.end_date],['Status',tx(c.status)],['Fayda',tx('Not verified (provider not connected)')],['DARS',tx('Not authenticated')]]}).replace(/'/g,'&#39;')})'>Print letter</button>`:''}</div>`).join(''):'<div class="card mu">No contracts yet.</div>';
async function staffView(){const M=await meta(),o=U.org||{};
 let h=`<div class="card"><b>${esc(o.name)}</b> <span class="st">${ex((M.kinds[o.kind]||{}).label||o.kind)}</span><div class="mu">Area of responsibility: ${place(o)?esc(place(o)):'All woredas'}</div><div class="mu"><b>Your powers</b></div><ul class="mu">${U.powers.map(p=>`<li>${ex(M.powers[p])}</li>`).join('')||'<li>None.</li>'}</ul></div>`;
 if(!can('registry.read'))h+='<div class="card mu">Your organization cannot view buildings or contracts.</div>';
 else{const B=await api('/buildings'),C=await api('/contracts'),rv=can('building.review');
  h+='<h3>Applications in your area</h3>'+(B.map(b=>bCard(b,(b.status==='submitted'&&rv?`<button class="btn" onclick="rev(${b.id},'approve')">Approve and issue BRN</button><button class="btn g" onclick="rev(${b.id},'correction')">Request correction</button><button class="btn g" onclick="rev(${b.id},'reject')">Reject</button>`:'')+b.files.map(f=>`<a class="mu" href="#" onclick="openF(${f.id});return false">${ex(f.category)} file</a> `).join(''))).join('')||'<div class="card mu">Nothing to review.</div>')+'<h3>Contracts</h3>'+cList(C,can('contract.approve'))}
 const TX=can('tax.reports')?await taxCard().catch(()=>''):'',AU=can('audit.view')?await api('/admin/audit').catch(()=>null):null;
 return h+TX+(AU?auditCard(AU):'')}
async function taxCard(){const R=await api('/tax/reports');return '<div class="card"><b>Rental income declarations</b>'+(R.map(x=>`<div class="mu">${x.contract} · ${x.period} · declared ${x.declared} · rent ${x.rent} · estimate ${x.estimate} (rule ${esc(x.rule_version)}, not an assessment)${x.mismatch?' · MISMATCH':''}</div>`).join('')||'<div class="mu">No declarations.</div>')+'</div>'}
const auditCard=A=>`<div class="card"><b>Audit trail</b>${A.map(a=>`<div class="mu">${a.ts.slice(0,16)} · ${esc(a.actor)} · ${esc(a.action)} · ${esc(a.entity)}</div>`).join('')}</div>`;
const powerBoxes=(M,id,on)=>`<div id="${id}">${Object.entries(M.powers).map(([k,t])=>`<label class="pw"><input type="checkbox" value="${k}"${on.includes(k)?' checked':''}><span>${ex(t)}</span></label>`).join('')}</div>`;
const orgCard=(o,M)=>`<div class="card"><b>${esc(o.name)}</b> <span class="st">${ex((M.kinds[o.kind]||{}).label||o.kind)}</span>${o.active?'':' <span class="st">inactive</span>'}
<div class="mu">Area of responsibility: ${place(o)?esc(place(o)):'All woredas'}</div>
${o.members.map(m=>`<div class="mu">${esc(m.name)} · ${esc(m.email)}${m.active?'':' · inactive'} <a href="#" onclick="setActive(${m.id},${!m.active});return false">${m.active?'Deactivate':'Activate'}</a></div>`).join('')||'<div class="mu">No accounts yet.</div>'}
<div class="row"><input id="mn${o.id}" placeholder="Name"><input id="me${o.id}" type="email" placeholder="Email"><input id="mp${o.id}" type="password" placeholder="Password (8+)"></div><button class="btn g" onclick="addMember(${o.id})">Add account</button>
<details><summary>Powers</summary>${powerBoxes(M,'e'+o.id,o.powers)}<button class="btn" onclick="savePowers(${o.id})">Save powers</button></details>
<button class="btn g" onclick="orgActive(${o.id},${!o.active})">${o.active?'Deactivate organization':'Activate organization'}</button></div>`;
async function adminView(){const [AU,O,M]=await Promise.all([api('/admin/audit'),api('/admin/orgs'),meta()]);
 return `<div class="card"><b>Create organization</b><div class="row"><input id="gn" placeholder="Organization name"><select id="gk" onchange="kindPick()">${Object.entries(M.kinds).map(([k,x])=>`<option value="${k}">${ex(x.label)}</option>`).join('')}</select><input id="gw" placeholder="Woreda (its area; empty = all)"><input id="gx" placeholder="Kebele (optional)"></div>${powerBoxes(M,'gp',Object.values(M.kinds)[0].powers)}<div class="mu">First account (optional)</div><div class="row"><input id="ga" placeholder="Name"><input id="ge" type="email" placeholder="Email"><input id="gq" type="password" placeholder="Password (8+)"></div><button class="btn" onclick="mkOrg()">Create organization</button></div><h3>Organizations</h3>${O.map(o=>orgCard(o,M)).join('')||'<div class="card mu">None.</div>'}${auditCard(AU)}`}
async function tools(){const VK=['etrade','dars','fayda'].filter(k=>can('verify.'+k)),P=U.role!=='owner',N=await api('/notifications').catch(()=>[]),D=await api('/disputes').catch(()=>[]),V=VK.length?await api('/verifications').catch(()=>[]):[],R=can('tax.rules')?await api('/tax/rules').catch(()=>[]):null;
return `<div class="card"><b>Notifications</b>${N.slice(0,5).map(n=>`<div class="mu">${n.ts.slice(0,10)} · ${esc(tx(n.text))}</div>`).join('')||'<div class="mu">None.</div>'}<button class="btn g" onclick="exp('buildings','csv')">Export buildings CSV</button><button class="btn g" onclick="exp('contracts','csv')">Export contracts CSV</button><button class="btn g" onclick="exp('buildings','xlsx')">Buildings Excel</button><button class="btn g" onclick="exp('contracts','xlsx')">Contracts Excel</button>${P?'<button class="btn g" onclick="mfa()">Set up MFA</button><div id="mfabox"></div>':''}</div>
${D.length?`<div class="card"><b>Disputes</b>${D.map(d=>`<div class="mu">#${d.id} · contract ${d.contract_id} · ${d.status} · ${esc(d.reason)} ${can('dispute.resolve')&&d.status==='open'?`<a href="#" onclick="resolveD(${d.id});return false">resolve</a>`:''}</div>`).join('')}</div>`:''}
${VK.length?`<div class="card"><b>Manual verification (eTrade, DARS, Fayda)</b><div class="row"><select id="vk">${VK.map(k=>`<option value="${k}">${VN[k]}</option>`).join('')}</select><input id="ve" placeholder="Entity (contract or tenant)"><input id="vr" placeholder="Official reference"><input id="vs" placeholder="Source of evidence"></div><button class="btn" onclick="ver()">Record</button>${V.slice(0,5).map(x=>`<div class="mu">${x.kind} · ${esc(x.entity)} · ${esc(x.reference)}</div>`).join('')}</div>`:''}
${R?`<div class="card"><b>Tax rules</b><div class="row"><input id="tv" placeholder="Version"><input id="tr" placeholder="Rate (0.10 = 10%)"><input id="tn" placeholder="Source note"></div><button class="btn" onclick="rule()">Save rule</button>${R.map(x=>`<div class="mu">${esc(x.version)} · ${x.rate}${x.active?' · active':''}</div>`).join('')}</div>`:''}
<div class="card"><b>Change password</b><div class="row"><input id="cpo" type="password" autocomplete="current-password" placeholder="Current password"><input id="cpn" type="password" autocomplete="new-password" placeholder="New password (8+)"></div><button class="btn" onclick="chpw()">Change password</button></div>`}
async function exp(k,ext){const r=await fetch('/api/v1/reports/'+k+'.'+ext,{headers:{Authorization:'Bearer '+T}});if(!r.ok)return say('Export not allowed.');const a=document.createElement('a');a.href=URL.createObjectURL(await r.blob());a.download=k+'.'+ext;a.click()}
const decl=id=>run(()=>{const p=ask('Period (YYYY-MM)'),a=ask('Rent received (ETB)');return api('/tax/declarations',{body:{contract_id:id,period:p,declared:+a}}).then(d=>say(d.notice))});
const disp=id=>run(()=>{const r=ask('Reason');return api('/disputes',{body:{contract_id:id,reason:r}})});
const insp=id=>run(()=>{const n=ask('Inspection notes');if(!n)throw Error('Notes are required.');return new Promise(res=>{const g=(a,b)=>res(api('/inspections',{body:{building_id:id,notes:n,lat:a,lng:b}}));navigator.geolocation?navigator.geolocation.getCurrentPosition(p=>g(p.coords.latitude,p.coords.longitude),()=>g(null,null)):g(null,null)})});
const resolveD=id=>run(()=>api(`/disputes/${id}/resolve`,{method:'POST'}));

function tx(s){if(lang!=='am'||s==null)return s;s=String(s);const k=s.trim();if(!k)return s;if(AMX[k])return s.replace(k,AMX[k]);if(AM[k])return s.replace(k,AM[k]);
 for(const[re,f]of DYN){const m=k.match(re);if(m)return s.replace(k,f(...m))}
 return s.replace(PRE,(m,a,w)=>a+(AM[w]||AML[w.toLowerCase()]||w))}
